version: 2

models:
  - name: stg_orders
    description: "Cleaned orders, one row per order."
    columns:
      - name: order_id
        description: "Primary key of an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "FK to customers (per-order id)."
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customers."
    columns:
      - name: customer_id
        description: "Per-order customer id (unique in this table)."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Real customer (person) identifier."
        tests:
          - not_null

  - name: stg_order_items
    description: "Cleaned order items, one row per item."
    columns:
      - name: order_id
        description: "FK to stg_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: seller_id
        description: "FK to stg_sellers."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: price
        tests:
          - not_null

  - name: stg_geolocation
    description: "Cleaned geolocation lookup, multiple rows per zip code prefix."
    columns:
      - name: geolocation_zip_code_prefix
        description: "Zip code prefix (not unique, many lat/lng per prefix)."
        tests:
          - not_null
      - name: geolocation_lat
        tests:
          - not_null
      - name: geolocation_lng
        tests:
          - not_null

  - name: stg_order_payments
    description: "Cleaned order payments, one row per payment installment."
    columns:
      - name: order_id
        description: "FK to stg_orders (not unique, an order can have multiple payments)."
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: stg_product_category_name_translation
    description: "Lookup mapping Portuguese category names to English."
    columns:
      - name: product_category_name
        description: "Primary key of this lookup table."
        tests:
          - unique
          - not_null
      - name: product_category_name_english
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned products, one row per product."
    columns:
      - name: product_id
        description: "Primary key of a product."
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: "FK to category translation. ~610 nulls detected — flagged as warning, root cause to be investigated with product team."
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_sellers
    description: "Cleaned sellers, one row per seller."
    columns:
      - name: seller_id
        description: "Primary key of a seller."
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        tests:
          - not_null