name: CI - SQLFluff & dbt build

on: [push, pull_request]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    # ESTO ES LO QUE CAMBIA: Le decimos que se pare en la carpeta olist
    defaults:
      run:
        working-directory: ./olist 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install dbt-bigquery sqlfluff sqlfluff-templater-dbt

      - name: Authenticate to Google Cloud
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > $HOME/gcp-sa-key.json

      - name: Setup dbt profile for CI
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          olist_store:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: data-eng-portfolio-503716
                dataset: dbt_ci_testing
                threads: 4
                keyfile: $HOME/gcp-sa-key.json
                location: US
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Run SQLFluff Lint
        run: sqlfluff lint models/

      - name: Run dbt build
        run: dbt build --target ci